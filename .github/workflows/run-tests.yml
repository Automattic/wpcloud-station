name: Run Tests

on:
  pull_request:
    branches: [ trunk ]
  push:
    branches: [ trunk ]

jobs:
  validate:
    name: Validate Composer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

  lint-php:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2, phpcs
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run PHP_CodeSniffer
        working-directory: ./plugin
        run: vendor/bin/phpcs --standard=.phpcs.xml.dist --extensions=php .

  lint-js:
    name: JavaScript/CSS Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11'
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Lint JavaScript
        working-directory: ./plugin
        run: npm run lint:js

      - name: Lint CSS
        working-directory: ./plugin
        run: npm run lint:css

  test:
    name: WordPress Tests
    runs-on: ubuntu-latest
    needs: [validate, lint-php, lint-js]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11'
          cache: 'npm'

      - name: Install global dependencies
        run: npm install -g @wordpress/env

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install Node.js dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Start WordPress environment
        run: wp-env start

      - name: Run PHPUnit tests
        run: |
          # Create verbose logging flag file if needed
          touch plugin/tests/verbose_logging_enabled

          # Run tests using wp-env
          wp-env run tests-cli --env-cwd=wp-content/plugins/wpcloud-station-plugin php -d memory_limit=256M vendor/bin/phpunit

          # Clean up
          rm -f plugin/tests/verbose_logging_enabled

      - name: Run JavaScript tests
        working-directory: ./plugin
        run: npm run test

      - name: Stop WordPress environment
        run: wp-env stop
        if: always()
