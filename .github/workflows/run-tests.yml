name: Run Tests

on:
  pull_request:
    branches: [ trunk ]
  push:
    branches: [ trunk ]

jobs:
  validate:
    name: Validate Composer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        run: composer validate

  lint-php:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2, phpcs
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Get changed PHP files
        id: changed-php-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For pull requests, compare with the base branch
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            # For pushes, compare with the parent commit
            BASE_SHA=$(git rev-parse HEAD^)
            HEAD_SHA=${{ github.sha }}
          fi

          # Get list of changed PHP files in the plugin directory
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA $HEAD_SHA | grep -E "^plugin/.*\.php$" || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No PHP files changed in the plugin directory."
            echo "changed_files=" >> $GITHUB_OUTPUT
            echo "::set-output name=any_changed::false"
          else
            # Format the list for phpcs
            FORMATTED_FILES=$(echo "$CHANGED_FILES" | sed 's|^plugin/|./|' | tr '\n' ' ')
            echo "Changed PHP files: $FORMATTED_FILES"
            echo "changed_files=$FORMATTED_FILES" >> $GITHUB_OUTPUT
            echo "::set-output name=any_changed::true"
          fi

      - name: Run PHP_CodeSniffer on changed files
        working-directory: ./plugin
        if: steps.changed-php-files.outputs.any_changed == 'true'
        run: ../vendor/bin/phpcs --standard=.phpcs.xml.dist --extensions=php --warning-severity=0 ${{ steps.changed-php-files.outputs.changed_files }}

      - name: Skip PHP_CodeSniffer
        if: steps.changed-php-files.outputs.any_changed != 'true'
        run: echo "No PHP files changed, skipping PHP_CodeSniffer"

  lint-js:
    name: JavaScript/CSS Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11'
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Get changed JS/CSS files
        id: changed-js-css-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For pull requests, compare with the base branch
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            # For pushes, compare with the parent commit
            BASE_SHA=$(git rev-parse HEAD^)
            HEAD_SHA=${{ github.sha }}
          fi

          # Get list of changed JS files in the plugin directory
          JS_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA $HEAD_SHA | grep -E "^plugin/.*\.(js|jsx|ts|tsx)$" || true)

          # Get list of changed CSS files in the plugin directory
          CSS_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA $HEAD_SHA | grep -E "^plugin/.*\.(css|scss|sass)$" || true)

          if [ -z "$JS_FILES" ]; then
            echo "No JS files changed in the plugin directory."
            echo "js_files=" >> $GITHUB_OUTPUT
            echo "::set-output name=js_changed::false"
          else
            # Format the list for eslint
            FORMATTED_JS_FILES=$(echo "$JS_FILES" | tr '\n' ' ')
            echo "Changed JS files: $FORMATTED_JS_FILES"
            echo "js_files=$FORMATTED_JS_FILES" >> $GITHUB_OUTPUT
            echo "::set-output name=js_changed::true"
          fi

          if [ -z "$CSS_FILES" ]; then
            echo "No CSS files changed in the plugin directory."
            echo "css_files=" >> $GITHUB_OUTPUT
            echo "::set-output name=css_changed::false"
          else
            # Format the list for stylelint
            FORMATTED_CSS_FILES=$(echo "$CSS_FILES" | tr '\n' ' ')
            echo "Changed CSS files: $FORMATTED_CSS_FILES"
            echo "css_files=$FORMATTED_CSS_FILES" >> $GITHUB_OUTPUT
            echo "::set-output name=css_changed::true"
          fi

      - name: Lint JavaScript
        working-directory: ./plugin
        if: steps.changed-js-css-files.outputs.js_changed == 'true'
        run: |
          # Create a temporary file with the list of files to lint
          echo "${{ steps.changed-js-css-files.outputs.js_files }}" > js_files_to_lint.txt
          # Run lint:js only on the changed files
          npx wp-scripts lint-js $(cat js_files_to_lint.txt)
          rm js_files_to_lint.txt

      - name: Skip JavaScript Lint
        if: steps.changed-js-css-files.outputs.js_changed != 'true'
        run: echo "No JavaScript files changed, skipping JavaScript linting"

      - name: Lint CSS
        working-directory: ./plugin
        if: steps.changed-js-css-files.outputs.css_changed == 'true'
        run: |
          # Create a temporary file with the list of files to lint
          echo "${{ steps.changed-js-css-files.outputs.css_files }}" > css_files_to_lint.txt
          # Run lint:css only on the changed files
          npx wp-scripts lint-style $(cat css_files_to_lint.txt)
          rm css_files_to_lint.txt

      - name: Skip CSS Lint
        if: steps.changed-js-css-files.outputs.css_changed != 'true'
        run: echo "No CSS files changed, skipping CSS linting"

  test-php:
    name: PHP Tests
    runs-on: ubuntu-latest
    needs: [validate, lint-php]
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-progress

      - name: Cache WordPress test suite
        id: cache-wp-tests
        uses: actions/cache@v3
        with:
          path: /tmp/wordpress-tests-lib
          key: ${{ runner.os }}-wp-tests-lib-127.0.0.1-${{ hashFiles('plugin/bin/install-wp-tests.sh') }}

      - name: Install Subversion
        if: steps.cache-wp-tests.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        if: steps.cache-wp-tests.outputs.cache-hit != 'true'
        run: |
          bash plugin/bin/install-wp-tests.sh wordpress_test root root 127.0.0.1 latest true

      - name: Verify MySQL connection
        run: |
          # Wait for MySQL to be ready
          echo "Waiting for MySQL to be ready..."
          timeout 15 bash -c "until mysql -h127.0.0.1 -uroot -proot -e 'SELECT 1'; do sleep 1; done"
          echo "MySQL is up and running!"

      - name: Create verbose logging flag file
        run: touch plugin/tests/verbose_logging_enabled

      - name: Run PHPUnit tests
        working-directory: ./plugin
        run: |
          # Set environment variables for WordPress tests
          export WP_TESTS_DIR=/tmp/wordpress-tests-lib

          # Update wp-tests-config.php to use 127.0.0.1 instead of localhost
          if [ -f "$WP_TESTS_DIR/wp-tests-config.php" ]; then
            sed -i 's|localhost|127.0.0.1|' "$WP_TESTS_DIR/wp-tests-config.php"
          fi

          # Run tests directly with PHPUnit
          php -d memory_limit=256M ../vendor/bin/phpunit

      - name: Clean up
        run: rm -f plugin/tests/verbose_logging_enabled
        if: always()

  test-js:
    name: JavaScript Tests
    runs-on: ubuntu-latest
    needs: [validate, lint-js]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11'
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Run JavaScript tests
        working-directory: ./plugin
        run: npm run test
