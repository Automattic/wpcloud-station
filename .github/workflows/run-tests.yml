name: Run Tests

on:
  pull_request:
    branches: [ trunk ]
  push:
    branches: [ trunk ]

jobs:
  validate:
    name: Validate Composer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer:v2
          coverage: none

      - name: Validate composer.json
        working-directory: ./plugin
        run: composer validate --strict

  lint-php:
    name: PHP Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2, phpcs
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: ./plugin
        run: composer install --prefer-dist --no-progress

      - name: Get changed PHP files
        id: changed-php-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For pull requests, compare with the base branch
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            # For pushes, compare with the parent commit
            BASE_SHA=$(git rev-parse HEAD^)
            HEAD_SHA=${{ github.sha }}
          fi

          # Get list of changed PHP files in the plugin directory
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA $HEAD_SHA | grep -E "^plugin/.*\.php$" || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No PHP files changed in the plugin directory."
            echo "changed_files=" >> $GITHUB_OUTPUT
            echo "any_changed=false" >> $GITHUB_OUTPUT
          else
            # Format the list for phpcs
            FORMATTED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')
            echo "Changed PHP files: $FORMATTED_FILES"
            echo "changed_files=$FORMATTED_FILES" >> $GITHUB_OUTPUT
            echo "any_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Run PHP_CodeSniffer on changed files
        working-directory: ./plugin
        if: steps.changed-php-files.outputs.any_changed == 'true'
        run: vendor/bin/phpcs --standard=.phpcs.xml.dist --extensions=php ${{ steps.changed-php-files.outputs.changed_files }}

      - name: Skip PHP_CodeSniffer
        if: steps.changed-php-files.outputs.any_changed != 'true'
        run: echo "No PHP files changed, skipping PHP_CodeSniffer"

  lint-js:
    name: JavaScript/CSS Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11'
          cache: 'npm'
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Get changed JS/CSS files
        id: changed-js-css-files
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For pull requests, compare with the base branch
            BASE_SHA=${{ github.event.pull_request.base.sha }}
            HEAD_SHA=${{ github.event.pull_request.head.sha }}
          else
            # For pushes, compare with the parent commit
            BASE_SHA=$(git rev-parse HEAD^)
            HEAD_SHA=${{ github.sha }}
          fi

          # Get list of changed JS files in the plugin directory
          JS_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA $HEAD_SHA | grep -E "^plugin/.*\.(js|jsx|ts|tsx)$" || true)

          # Get list of changed CSS files in the plugin directory
          CSS_FILES=$(git diff --name-only --diff-filter=ACMRT $BASE_SHA $HEAD_SHA | grep -E "^plugin/.*\.(css|scss|sass)$" || true)

          if [ -z "$JS_FILES" ]; then
            echo "No JS files changed in the plugin directory."
            echo "js_files=" >> $GITHUB_OUTPUT
            echo "js_changed=false" >> $GITHUB_OUTPUT
          else
            # Format the list for eslint
            FORMATTED_JS_FILES=$(echo "$JS_FILES" | tr '\n' ' ')
            echo "Changed JS files: $FORMATTED_JS_FILES"
            echo "js_files=$FORMATTED_JS_FILES" >> $GITHUB_OUTPUT
            echo "js_changed=true" >> $GITHUB_OUTPUT
          fi

          if [ -z "$CSS_FILES" ]; then
            echo "No CSS files changed in the plugin directory."
            echo "css_files=" >> $GITHUB_OUTPUT
            echo "css_changed=false" >> $GITHUB_OUTPUT
          else
            # Format the list for stylelint
            FORMATTED_CSS_FILES=$(echo "$CSS_FILES" | tr '\n' ' ')
            echo "Changed CSS files: $FORMATTED_CSS_FILES"
            echo "css_files=$FORMATTED_CSS_FILES" >> $GITHUB_OUTPUT
            echo "css_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Lint JavaScript
        working-directory: ./plugin
        if: steps.changed-js-css-files.outputs.js_changed == 'true'
        run: |
          # Create a temporary file with the list of files to lint
          echo "${{ steps.changed-js-css-files.outputs.js_files }}" > js_files_to_lint.txt
          # Run lint:js only on the changed files
          npx wp-scripts lint-js $(cat js_files_to_lint.txt)
          rm js_files_to_lint.txt

      - name: Skip JavaScript Lint
        if: steps.changed-js-css-files.outputs.js_changed != 'true'
        run: echo "No JavaScript files changed, skipping JavaScript linting"

      - name: Lint CSS
        working-directory: ./plugin
        if: steps.changed-js-css-files.outputs.css_changed == 'true'
        run: |
          # Create a temporary file with the list of files to lint
          echo "${{ steps.changed-js-css-files.outputs.css_files }}" > css_files_to_lint.txt
          # Run lint:css only on the changed files
          npx wp-scripts lint-style $(cat css_files_to_lint.txt)
          rm css_files_to_lint.txt

      - name: Skip CSS Lint
        if: steps.changed-js-css-files.outputs.css_changed != 'true'
        run: echo "No CSS files changed, skipping CSS linting"

  test:
    name: WordPress Tests
    runs-on: ubuntu-latest
    needs: [validate, lint-php, lint-js]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, mysqli, zip
          tools: composer:v2
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.11'
          cache: 'npm'

      - name: Install global dependencies
        run: npm install -g @wordpress/env

      - name: Install PHP dependencies
        working-directory: ./plugin
        run: composer install --prefer-dist --no-progress

      - name: Install Node.js dependencies
        working-directory: ./plugin
        run: npm ci

      - name: Start WordPress environment
        run: wp-env start

      - name: Run PHPUnit tests
        run: |
          # Create verbose logging flag file if needed
          touch plugin/tests/verbose_logging_enabled

          # Create a custom bootstrap file
          cat > custom-bootstrap.php << 'EOF'
          <?php
          /**
           * PHPUnit bootstrap file.
           *
           * @package wpcloud-client
           */

          require_once '/var/www/html/wp-content/plugins/wpcloud-station-plugin/tests/class-mock-wpcloud-api-request.php';
          require_once '/var/www/html/wp-content/plugins/wpcloud-station-plugin/includes/class-wpcloud-api-client.php';
          require_once '/var/www/html/wp-content/plugins/wpcloud-station-plugin/includes/class-wpcloud-api-request.php';

          $_tests_dir = getenv( 'WP_TESTS_DIR' );

          if ( ! $_tests_dir ) {
            $_tests_dir = rtrim( sys_get_temp_dir(), '/\\' ) . '/wordpress-tests-lib';
          }

          // Forward custom PHPUnit Polyfills autoloader file for WP < 5.9.
          if ( ! defined( 'WP_TESTS_PHPUNIT_POLYFILLS_PATH' ) ) {
            define( 'WP_TESTS_PHPUNIT_POLYFILLS_PATH', '/var/www/html/wp-content/plugins/wpcloud-station-plugin/vendor/yoast/phpunit-polyfills/phpunitpolyfills-autoload.php' );
          }

          if ( ! file_exists( "{$_tests_dir}/includes/functions.php" ) ) {
            echo "Could not find {$_tests_dir}/includes/functions.php, have you run bin/install-wp-tests.sh ?" . PHP_EOL; // phpcs:ignore WordPress.Security.EscapeOutput.OutputNotEscaped
            exit( 1 );
          }

          require_once "{$_tests_dir}/includes/functions.php";

          require_once '/var/www/html/wp-content/plugins/wpcloud-station-plugin/vendor/autoload.php';
          require_once '/var/www/html/wp-content/plugins/wpcloud-station-plugin/tests/class-mock-helper.php';

          /**
           * Manually load the plugin being tested.
           */
          function _manually_load_plugin() {
            require '/var/www/html/wp-content/plugins/wpcloud-station-plugin/wpcloud-station.php';
          }

          tests_add_filter( 'muplugins_loaded', '_manually_load_plugin' );

          // Start up the WP testing environment.
          require "{$_tests_dir}/includes/bootstrap.php";

          // Define WPCLOUD_TESTING constant to enable mocking in wpcloud_client functions.
          if ( ! defined( 'WPCLOUD_TESTING' ) ) {
            define( 'WPCLOUD_TESTING', true );
          }

          // Add a filter to provide a mock API key for testing.
          add_filter(
            'wpcloud_api_key',
            function ( $api_key ) {
              return 'test_api_key';
            }
          );

          // Add a filter to provide a mock client name for testing.
          add_filter(
            'wpcloud_client_name',
            function ( $client_name ) {
              return 'test_client';
            }
          );

          // Add a filter to provide a mock WPCloud_API_Request.
          add_filter(
            'wpcloud_api_request_instance',
            function ( $request ) {
              return Mock_Helper::get_request_mock();
            }
          );
          EOF

          # Copy the custom bootstrap file to the Docker container
          wp-env run tests-cli --env-cwd=/ cp /var/www/html/custom-bootstrap.php /tmp/bootstrap.php

          # Verify the MySQL connection
          wp-env run tests-cli bash -c "mysql -hdb -uroot -proot -e 'SELECT 1;'"

          # Run tests using wp-env
          wp-env run tests-cli --env-cwd=wp-content/plugins/wpcloud-station-plugin php -d memory_limit=256M vendor/bin/phpunit --bootstrap=/tmp/bootstrap.php

          # Clean up
          rm -f plugin/tests/verbose_logging_enabled
          rm -f custom-bootstrap.php

      - name: Run JavaScript tests
        working-directory: ./plugin
        run: npm run test

      - name: Stop WordPress environment
        run: wp-env stop
        if: always()
